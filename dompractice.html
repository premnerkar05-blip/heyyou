  <ul id="myList"></ul>
	<button onclick="addItem()">Add Item</button>
 
	<script>
    	function addItem() {
        	var listItem = document.createElement('li')
            listItem.textContent = 'New Item'
            document.getElementById('myList').appendChild(listItem)
    	}
	</script> 


    	<li>Item 1</li>
    	<li>Item 2</li>
    	<li>Item 3</li>
	</ul>
	<button onclick="removeItem()">Remove Last Item</button>
 
	<script>
    	function removeItem() {
        	var list = document.getElementById('myList')
            list.removeChild(list.lastElementChild)
    	}
	</script>

  <form id="myForm" onsubmit="return validateForm()">
    	<input type="text" id="name" placeholder="Enter your name">
    	<input type="submit" value="Submit">
	</form>
	<p id="error" style="color: red;"></p>
 
	<script>
    	function validateForm() {
        	var name = document.getElementById('name').value
        	if (name === '') {
                document.getElementById('error').textContent = 'Name is required'
            	return false
        	}
        	return true
    	}
	</script>

	<p id="dateTime"></p>
	<button onclick="showDateTime()">Show Date and Time</button>
 
	<script>
    	function showDateTime() {
        	var now = new Date()
            document.getElementById('dateTime').textContent = now.toString()
    	}
	</script>

	<button id="myButton" onclick="changeButtonStyle()">Click Me</button>
 
	<script>
    	function changeButtonStyle() {
        	var button = document.getElementById('myButton')
            button.style.backgroundColor = 'green'
            button.style.color = 'white'
    	}
	</script>

	<button id="myButton">Click Me</button>
 
	<script>
